<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yvorcer</title>
<meta name="description" content="Small, keyboard-first apps for the Mac, by Yvorcer.">
<meta name="theme-color" content="#0B1020">
<meta property="og:title" content="Yvorcer">
<meta property="og:description" content="Small, keyboard-first apps for the Mac.">
<meta property="og:image" content="https://yvorcer.github.io/media/yvorcer-og.jpg">
<meta property="og:url" content="https://yvorcer.github.io/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="quicksnip/media/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; --bg: #0B1020; --raise: #111832; --surface: #151D38; --line: rgba(255,255,255,.08); --text: #E9EEFB; --muted: #9AA6C6; --faint: #6E7A9C;
          --accent: #6CF0FF; --accent-b: #3D7BFF;
          --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
          --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--text); font: 17px/1.6 var(--font); -webkit-font-smoothing: antialiased;
         background: radial-gradient(900px 520px at 50% -120px, rgba(61,123,255,.22), transparent 70%), var(--bg); }
  main { max-width: 720px; margin-inline: auto; padding: 72px 20px 40px; }

  /* Photo, framed as an old-school app window */
  .window { position: relative; margin: 0 0 44px; border-radius: 14px; background: var(--raise); border: 1px solid var(--line);
            box-shadow: 0 30px 80px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.3); }
  .window::before { content: ""; position: absolute; inset: 12% 8% -6%; z-index: -1; border-radius: 50%;
                    background: radial-gradient(closest-side, rgba(108,240,255,.18), transparent); filter: blur(40px); }
  .titlebar { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px;
              background: repeating-linear-gradient(transparent 0 2px, rgba(255,255,255,.07) 2px 3px) 0 50% / 100% 13px no-repeat content-box; }
  .titlebar i { flex: none; width: 13px; height: 13px; border: 1px solid rgba(255,255,255,.28); border-radius: 2px; background: var(--raise); }
  .titlebar span { margin-inline: auto; padding: 0 10px; background: var(--raise); font: 500 12px/1 var(--mono); color: var(--muted); letter-spacing: .02em; }
  .titlebar::after { content: ""; width: 13px; flex: none; }
  .window img { display: block; width: 100%; height: auto; border-radius: 0 0 13px 13px; }

  h1 { margin: 0; font-size: clamp(38px, 7vw, 56px); line-height: 1.08; font-weight: 800; letter-spacing: -0.035em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--accent-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.lede { color: var(--muted); font-size: 19px; margin: 12px 0 56px; }

  h2 { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
  a.app { display: flex; gap: 18px; align-items: center; padding: 18px 22px 18px 18px; border-radius: 16px; background: var(--raise); border: 1px solid var(--line);
          color: inherit; text-decoration: none; transition: transform .2s ease, border-color .2s ease, background-color .2s ease; }
  a.app:hover { transform: translateY(-2px); border-color: rgba(108,240,255,.35); background: var(--surface); }
  a.app:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  a.app img { width: 64px; height: 64px; flex: none; }
  a.app div { flex: 1; min-width: 0; }
  a.app strong { display: block; font-size: 19px; }
  a.app span { display: block; color: var(--muted); font-size: 15px; line-height: 1.45; margin-top: 2px; }
  a.app b { flex: none; color: var(--faint); font-size: 20px; font-weight: 400; transition: transform .2s ease, color .2s ease; }
  a.app:hover b { transform: translateX(4px); color: var(--accent); }

  footer { max-width: 720px; margin-inline: auto; padding: 32px 20px 56px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
           color: var(--faint); font-size: 14px; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  @media (prefers-reduced-motion: no-preference) {
    .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
    .rise:nth-child(2) { animation-delay: .08s; }
    .rise:nth-child(3) { animation-delay: .16s; }
    .rise:nth-child(4) { animation-delay: .24s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  }
  @media (max-width: 520px) {
    main { padding-top: 40px; }
    p.lede { font-size: 17px; margin-bottom: 44px; }
  }
</style>
</head>
<body>
<main>
  <figure class="window rise">
    <div class="titlebar" aria-hidden="true"><i></i><span>hello.webp</span></div>
    <img src="media/yvorcer-1534.webp" srcset="media/yvorcer-900.webp 900w, media/yvorcer-1534.webp 1534w" sizes="(max-width: 720px) 100vw, 680px"
         width="1534" height="1025" fetchpriority="high"
         alt="A felt puppet with curly hair, in a black turtleneck and jeans, sits cross-legged on a wooden floor with its arms folded on top of a vintage beige computer whose screen shows a pixel smiley face.">
  </figure>
  <h1 class="rise">Hi, I’m <em>Yvorcer</em>.</h1>
  <p class="lede rise">I make small, keyboard-first apps for the Mac.</p>
  <section class="rise">
    <h2>Apps</h2>
    <a class="app" href="quicksnip/">
      <img src="quicksnip/media/icon.svg" alt="">
      <div><strong>QuickSnip</strong><span>Screenshots for Mac. Select, press C, and it’s on your clipboard.</span></div>
      <b aria-hidden="true">→</b>
    </a>
  </section>
</main>
<footer>
  <span>© 2026 Yvorcer</span>
  <a href="https://github.com/Yvorcer">GitHub</a>
</footer>
</body>
</html>
