<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yvorcer</title>
<meta name="description" content="Apps by Yvorcer.">
<link rel="icon" href="quicksnip/media/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; --bg: #0B1020; --raise: #111832; --line: rgba(255,255,255,.08); --text: #E9EEFB; --muted: #9AA6C6; --accent: #6CF0FF;
          --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
  main { max-width: 720px; margin-inline: auto; padding: 96px 20px; }
  h1 { margin: 0; font-size: clamp(36px, 6vw, 52px); font-weight: 800; letter-spacing: -0.03em; }
  p.lede { color: var(--muted); margin: 8px 0 48px; }
  h2 { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
  a.app { display: flex; gap: 18px; align-items: center; padding: 18px; border-radius: 16px; background: var(--raise); border: 1px solid var(--line); color: inherit; text-decoration: none; }
  a.app:hover { border-color: rgba(108,240,255,.35); }
  a.app:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  a.app img { width: 64px; height: 64px; flex: none; }
  a.app strong { display: block; font-size: 19px; }
  a.app span { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Yvorcer</h1>
  <p class="lede">Small, keyboard-first apps for the Mac.</p>
  <h2>Apps</h2>
  <a class="app" href="quicksnip/">
    <img src="quicksnip/media/icon.svg" alt="">
    <div><strong>QuickSnip</strong><span>Screenshots for Mac. Select, press C, and it’s on your clipboard.</span></div>
  </a>
</main>
</body>
</html>
